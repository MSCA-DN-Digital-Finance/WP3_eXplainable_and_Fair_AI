name: Folder check for irp17 (ownership)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  protect-irp17:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Fetch main for diff
        run: git fetch origin main

      - name: Block unauthorized irp17 changes
        run: |
          CHANGED=$(git diff --name-only origin/main)

          echo "🔍 Files changed:"
          echo "$CHANGED"
          echo ""

          if echo "$CHANGED" | grep -i '^irp17/' && [ "$GITHUB_ACTOR" != "your-github-username" ]; then
            echo "❌ Only @your-github-username is allowed to modify the irp17/ folder."
            exit 1
          else
            echo "✅ No unauthorized irp17/ changes detected."
          fi
