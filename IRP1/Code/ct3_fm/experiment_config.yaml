# Global defaults
global:
  T: 1024
  n_seeds: 10
  seed_offset: 0

experiments:
  # -----------------------
  # Experiment 1: RW drift
  # -----------------------
  - id: 1
    name: "RW drift"
    generator:
      type: "rw_drift"
      params:
        x0: 0.0
        sigma: 1.0
      sweep:
        mu: [-0.04, -0.02, 0.02, 0.04]
    prediction:
      task: "single_diff_forecast"
      window_length: 200
      forecast_window: 1
      step: 1
    analysis:
      param_stat: "mse"

  # -----------------------
  # Experiment 2: AR(1) persistence
  # -----------------------
  - id: 2
    name: "AR(1) persistence"
    generator:
      type: "ar1"
      params:
        x0: 0.0
        c: 0.0
        sigma: 1.0
      sweep:
        phi: [0.2, 0.5, 0.8, 0.95]
    prediction:
      task: "single_point_forecast"
      window_length: 200
      forecast_window: 1
      step: 1
    analysis:
      param_stat: "beta_slope"

  # -----------------------
  # Experiment 3: HO wavelength
  # -----------------------
  - id: 3
    name: "HO wavelength"
    generator:
      type: "harmonic"
      params:
        A: 1.0
        phase: 0.0
        offset: 0.0
        sigma: 0.05
      sweep:
        wavelength: [20, 50, 100, 200]
    prediction:
      task: "multistep_point_forecast"
      window_length: 200
      forecast_window: 200
      step: 1
    analysis:
      param_stat: "mse"

  # -----------------------
  # Experiment 4: AR(1) noise
  # -----------------------
  - id: 4
    name: "AR(1) noise"
    generator:
      type: "ar1"
      params:
        x0: 0.0
        c: 0.0
        phi: 0.5
      sweep:
        sigma: [0.1, 0.3, 1.0, 3.0]
    prediction:
      task: "single_point_forecast"
      window_length: 200
      forecast_window: 1
      step: 1
    analysis:
      param_stat: "mse"

  # -----------------------
  # Experiment 5: HO amplitude
  # -----------------------
  - id: 5
    name: "HO amplitude"
    generator:
      type: "harmonic"
      params:
        wavelength: 20
        phase: 0.0
        offset: 0.0
        sigma: 0.05
      sweep:
        A: [0.25, 0.5, 1.0, 2.0]
    prediction:
      task: "multistep_point_forecast"
      window_length: 200
      forecast_window: 200
      step: 1
    analysis:
      param_stat: "mse"